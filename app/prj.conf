# ============================================================
# Logging
# ============================================================

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Use deferred logging to reduce timing disturbance
CONFIG_LOG_MODE_DEFERRED=y

# Rate-limit repeated deadline warnings
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=1000


# ============================================================
# Thread inspection
# ============================================================

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y


# ============================================================
# Kernel shell
# ============================================================

CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Avoid sending normal logs through the shell backend
CONFIG_SHELL_LOG_BACKEND=n


# ============================================================
# Console / Serial
# ============================================================

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Required by native_sim serial PTY
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y


# ============================================================
# CTF tracing
# ============================================================

CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_POSIX=y
CONFIG_TRACING_PACKET_MAX_SIZE=64


# ============================================================
# Stack
# ============================================================

CONFIG_MAIN_STACK_SIZE=2048
