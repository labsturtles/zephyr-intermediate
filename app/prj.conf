
# ============================================================
# Kernel
# ============================================================

CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048


# ============================================================
# Logging
# ============================================================

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ============================================================
# Task Watchdog
# ============================================================

CONFIG_TASK_WDT=y


# ============================================================
# Development / reliability checks
# ============================================================

CONFIG_STACK_SENTINEL=y
